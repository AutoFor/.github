name: Sync open issues to org project

on:
  schedule:
    - cron: "*/15 * * * *" # 15分おき（GitHub側の負荷状況により多少遅延あり）
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync issues
        env:
          GH_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
        run: bash scripts/sync-issues-to-project.sh
